<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Master</title><link rel="stylesheet" href="style.css"><body><header><b>GAME MASTER</b><span id="round"></span></header><main><section class="panel"><h2>Authentication</h2><input id="key" type="password" placeholder="HOST_KEY"><button id="login">Unlock</button><p id="status"></p><div id="controls" class="hidden"><h2>Running order</h2><ol id="steps"></ol><button id="next">Next step</button><h3>Settings</h3><select id="mode"><option value="60">60-second voting</option><option value="10">10-second blind voting</option></select><label><input id="secretD" type="checkbox"> Enable secret D</label><button id="end">END GAME</button><button id="reset">Reset game</button><div id="results"></div></div></section><section class="panel"><h2>Players & scoring</h2><div id="players"></div><h3>Vote status (GM only)</h3><div id="votes"></div><h3>Team scores</h3><div id="teams"></div></section></main><script src="/socket.io/socket.io.js"></script><script src="gm.js"></script></body></html>
