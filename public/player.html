<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Don't Trust Your Teammates</title><link rel="stylesheet" href="style.css"><body><header><b>DON'T TRUST YOUR TEAMMATES</b><span id="round"></span></header><main><section class="panel" id="join"><h2>Join game</h2><input id="name" placeholder="Player name" maxlength="30"><select id="team"><option>Blue</option><option>Red</option></select><button id="joinBtn">Join</button></section><section class="panel" id="scores"><h2>Scores</h2><div class="score"><span>BLUE</span><strong id="blue">0</strong></div><div class="score"><span>RED</span><strong id="red">0</strong></div><hr><p>My points <strong id="mine">—</strong></p><p>My team <strong id="myteam">—</strong></p><h3>Players</h3><div id="players"></div></section><section class="panel"><div class="score"><h2 id="phase">Lobby</h2><strong id="timer"></strong></div><div id="voting" class="hidden"><p>Choose your vote</p><div class="choices" id="choices"></div></div><div id="power" class="hidden"><h3>SWAP power</h3><select id="target"></select><button id="swap">Use SWAP</button></div><div id="double" class="hidden"><label><input type="checkbox" id="doubleBox"> Double or Nothing</label></div><p id="status"></p><div id="results" class="hidden"></div><h3>Updates</h3><div id="events"></div></section></main><script src="/socket.io/socket.io.js"></script><script src="player.js"></script></body></html>
